<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amma Food Center (AFC) - Fresh Home Meals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        :root {
            --bg: #f6f4ff;
            --card: #ffffff;
            --card-shadow: 0 18px 45px -22px rgba(124, 58, 237, 0.45);
            --purple: #7c3aed;
            --purple-dark: #6d28d9;
            --text: #1f2230;
            --muted: #63657a;
        }

        body {
            background: var(--bg);
            color: var(--text);
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .gradient-purple {
            background: linear-gradient(135deg, #7c3aed 0%, #a78bfa 100%);
        }

        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Layout */
        .page-shell {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.25rem;
        }

        /* Topbar */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: linear-gradient(120deg, #7c3aed 0%, #9d6bfa 100%);
            color: #fff;
            padding: 16px 0;
            box-shadow: 0 18px 30px -18px rgba(102, 51, 153, 0.45);
        }

        .topbar__content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .topbar__brand h1 {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .topbar__brand p {
            color: rgba(255, 255, 255, 0.8);
            font-weight: 600;
            margin-top: 4px;
        }

        .icon-button {
            position: relative;
            border: none;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border-radius: 18px;
            padding: 10px 14px;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .icon-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 22px -12px rgba(0, 0, 0, 0.45);
        }

        /* Hero */
        .hero-card {
            background: linear-gradient(110deg, #7d3ff2 0%, #a166ff 70%, #b68cff 100%);
            color: #fff;
            border-radius: 18px;
            padding: 26px;
            margin: 20px auto 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            box-shadow: var(--card-shadow);
        }

        .hero-card h2 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .hero-card p {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
        }

        .hero-tags {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .hero-tag {
            background: rgba(255, 255, 255, 0.18);
            padding: 8px 14px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.9rem;
            backdrop-filter: blur(4px);
        }

        .hero-emoji {
            font-size: 3.5rem;
        }

        /* Categories */
        .section-heading {
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.85rem;
            font-weight: 800;
            color: #4b4d63;
            margin-bottom: 12px;
        }

        .category-section {
            margin-bottom: 18px;
        }

        .category-bar {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .chip {
            padding: 10px 18px;
            border-radius: 999px;
            background: #ffffff;
            border: 2px solid #e7e3ff;
            color: #5d5f73;
            font-weight: 700;
            transition: all 0.18s ease;
            box-shadow: 0 8px 22px -16px rgba(0, 0, 0, 0.35);
            white-space: nowrap;
        }

        .chip:hover {
            border-color: #c8b3ff;
            color: var(--purple);
        }

        .chip--active {
            background: var(--purple);
            color: #fff;
            border-color: var(--purple);
            box-shadow: 0 14px 30px -18px rgba(124, 58, 237, 0.7);
        }

        /* Menu Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
            margin-bottom: 90px;
        }

        .menu-card {
            background: var(--card);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 16px 40px -26px rgba(124, 58, 237, 0.5);
            border: 1px solid #f0edff;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            min-height: 280px;
        }

        .menu-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 22px 50px -28px rgba(124, 58, 237, 0.55);
        }

        .menu-card__image {
            position: relative;
            height: 150px;
            background: linear-gradient(135deg, #ede9fe, #f5f3ff);
        }

        .menu-card__image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .menu-card__body {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .menu-card__name {
            font-weight: 800;
            font-size: 1rem;
            margin: 0;
            color: #222233;
        }

        .menu-card__desc {
            margin: 0;
            color: #6b6d80;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .menu-card__footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
        }

        .menu-card__price {
            font-weight: 800;
            color: var(--purple);
            font-size: 1.1rem;
        }

        .add-btn,
        .qty-btn {
            font-weight: 800;
            border: 2px solid var(--purple);
            color: var(--purple);
            background: #fff;
            padding: 8px 18px;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.14s ease, box-shadow 0.14s ease, background 0.14s ease;
        }

        .add-btn:hover {
            background: #f3e8ff;
            box-shadow: 0 10px 24px -18px rgba(124, 58, 237, 0.7);
        }

        .qty-control {
            display: inline-flex;
            align-items: center;
            background: var(--purple);
            color: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 28px -20px rgba(124, 58, 237, 0.8);
        }

        .qty-control button {
            border: none;
            background: transparent;
            color: #fff;
            padding: 10px 12px;
            font-weight: 800;
            cursor: pointer;
        }

        .qty-control span {
            padding: 0 14px;
            font-weight: 800;
            letter-spacing: 0.02em;
        }

        .menu-card--disabled {
            filter: grayscale(0.7);
            opacity: 0.9;
        }

        .sold-out {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        /* Cart bar */
        .cart-bar {
            position: fixed;
            inset: auto 0 0 0;
            background: #fff;
            border-top: 1px solid #e8defc;
            box-shadow: 0 -10px 30px -18px rgba(124, 58, 237, 0.25);
            padding: 16px 0;
            z-index: 50;
        }

        .cart-bar__content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .checkout-btn {
            background: linear-gradient(120deg, #7c3aed, #9d6bfa);
            color: #fff;
            border: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 16px 30px -18px rgba(124, 58, 237, 0.6);
            transition: transform 0.14s ease, box-shadow 0.14s ease;
        }

        .checkout-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 20px 36px -18px rgba(124, 58, 237, 0.7);
        }

        /* Responsive tweaks */
        @media (max-width: 900px) {
            .hero-card {
                flex-direction: column;
                align-items: flex-start;
            }
            .hero-emoji {
                align-self: flex-end;
            }
        }

        @media (max-width: 640px) {
            .topbar__brand h1 {
                font-size: 1.35rem;
            }
            .hero-card h2 {
                font-size: 1.6rem;
            }
        }

        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(124, 58, 237, 0.2), 0 10px 10px -5px rgba(124, 58, 237, 0.1);
        }

        .pulse-animation {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .8;
            }
        }

        .shimmer {
            background: linear-gradient(90deg, #e5e5e5 25%, #f0f0f0 50%, #e5e5e5 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        /* Modern Modal Styles */
        :root {
            --modal-bg: rgba(0, 0, 0, 0.6);
            --modal-content-bg: #ffffff;
            --modal-transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @layer components {
            .modal-backdrop {
                position: fixed;
                inset: 0;
                background: var(--modal-bg);
                backdrop-filter: blur(4px);
                display: flex;
                align-items: flex-end;
                justify-content: center;
                z-index: 60;
                opacity: 0;
                pointer-events: none;
                transition: opacity var(--modal-transition);
            }

            .modal-backdrop.open {
                opacity: 1;
                pointer-events: auto;
            }

            .modal-content {
                background: var(--modal-content-bg);
                width: 100%;
                max-width: 32rem;
                /* max-w-lg */
                border-top-left-radius: 1.5rem;
                /* rounded-t-3xl */
                border-top-right-radius: 1.5rem;
                padding: clamp(1rem, 5vw, 1.5rem);
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
                transform: translateY(100%);
                transition: transform var(--modal-transition);
            }

            .modal-backdrop.open .modal-content {
                transform: translateY(0);
            }

            /* Desktop adjustment */
            @media (min-width: 640px) {
                .modal-backdrop {
                    align-items: center;
                }

                .modal-content {
                    border-radius: 1.5rem;
                    /* rounded-3xl */
                    transform: scale(0.95);
                    opacity: 0;
                }

                .modal-backdrop.open .modal-content {
                    transform: scale(1);
                    opacity: 1;
                }
            }
        }
    </style>
</head>

                class="w-full gradient-purple text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:shadow-xl transition-all transform hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center gap-2">

    <script src="config.js"></script>
    <script type="module">
        // --- CONFIGURATION ---
        const WHATSAPP_NUMBER = CONFIG.WHATSAPP_NUMBER;
        const API_URL = CONFIG.API_URL;

        // --- MODAL ---
        import { Modal } from './modal.js';
        let checkoutModal;

        document.addEventListener('DOMContentLoaded', () => {
            checkoutModal = new Modal('checkout-modal', {
                onOpen: () => console.log('Modal opened'),
                onClose: () => console.log('Modal closed')
            });

            window.checkoutModal = checkoutModal;
        });

        // --- STATE ---
        let menuItems = [];
        let cart = {};
        let activeCategory = "All";

        // --- RENDER FUNCTIONS ---
        async function init() {
            // Show loading state
            document.getElementById('menu-container').innerHTML = `
                <div class="col-span-full text-center py-12">
                    <div class="text-5xl mb-4 animate-bounce">🍳</div>
                    <p class="text-purple-600 font-semibold">Loading delicious menu...</p>
                </div>
            `;

            try {
                const response = await fetch(`${API_URL}/menu`);
                if (!response.ok) throw new Error('Failed to fetch menu');
                menuItems = await response.json();
                
                // Filter out items that are clearly invalid
                menuItems = menuItems.filter(item => item && item.name && item.price);
                
                renderCategories();
                renderMenu();
            } catch (error) {
                console.error("Error fetching menu:", error);
                document.getElementById('menu-container').innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <div class="text-6xl mb-4">😔</div>
                        <p class="text-red-500 font-semibold mb-2">Error loading menu</p>
                        <p class="text-sm text-gray-500 mb-4">Please check if the server is running</p>
                        <button onclick="location.reload()" class="bg-purple-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-purple-700 transition-colors">
                            🔄 Try Again
                        </button>
                    </div>
                `;
            }
        }

        // Auto-refresh menu every 3 seconds for fast updates
        let lastMenuCheck = 0;
        async function refreshMenu() {
            try {
                const response = await fetch(`${API_URL}/menu`);
                if (!response.ok) return;
                const newMenu = await response.json();
                
                // Only re-render if menu changed
                const newMenuStr = JSON.stringify(newMenu);
                const oldMenuStr = JSON.stringify(menuItems);
                
                if (newMenuStr !== oldMenuStr) {
                    console.log('🔄 Menu updated!');
                    menuItems = newMenu.filter(item => item && item.name && item.price);
                    renderCategories();
                    renderMenu();
                }
            } catch (e) {
                console.log('Refresh check failed:', e);
            }
        }
        
        // Start auto-refresh
        setInterval(refreshMenu, 3000);

        function renderCategories() {
            const categories = ["All", ...new Set(menuItems.map(item => item.category).filter(Boolean))];
            const container = document.getElementById('categories-container');

            container.innerHTML = categories.map(cat => `
                <button onclick="setCategory('${cat}')" class="chip ${activeCategory === cat ? 'chip--active' : ''}">
                    ${cat}
                </button>
            `).join('');
        }

        function setCategory(cat) {
            activeCategory = cat;
            renderCategories();
            renderMenu();
        }

        function renderMenu() {
            const container = document.getElementById('menu-container');
            const filteredItems = activeCategory === "All"
                ? menuItems
                : menuItems.filter(item => item.category === activeCategory);

            container.innerHTML = filteredItems.map(item => {
                const qty = cart[item.id] || 0;
                const isAvailable = item.availability !== false; // Default to true
                const imageFallback = 'https://dummyimage.com/600x400/ede9fe/6d28d9&text=Fresh+Meal';

                return `
                <div class="menu-card ${!isAvailable ? 'menu-card--disabled' : ''}">
                    <div class="menu-card__image">
                        <img src="${item.image}" alt="${item.name}" loading="lazy"
                            onerror="this.onerror=null;this.src='${imageFallback}';">
                        ${!isAvailable ? `<div class="sold-out">SOLD OUT</div>` : ''}
                    </div>
                    <div class="menu-card__body">
                        <div>
                            <p class="menu-card__name">${item.name}</p>
                            ${item.description ? `<p class="menu-card__desc">${item.description}</p>` : ''}
                        </div>
                        <div class="menu-card__footer">
                            <span class="menu-card__price">₹${item.price}</span>
                            ${!isAvailable
                        ? `<button disabled class="add-btn" style="opacity:0.5; cursor:not-allowed;">SOLD OUT</button>`
                        : (qty === 0
                            ? `<button onclick="updateQuantity(${item.id}, 1)" class="add-btn">ADD</button>`
                            : `<div class="qty-control">
                                <button onclick="updateQuantity(${item.id}, -1)">−</button>
                                <span>${qty}</span>
                                <button onclick="updateQuantity(${item.id}, 1)">+</button>
                              </div>`
                        )
                    }
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        // --- LOGIC ---
        function updateQuantity(itemId, change) {
            if (!cart[itemId]) cart[itemId] = 0;
            cart[itemId] += change;
            if (cart[itemId] <= 0) delete cart[itemId];
            renderMenu();
            updateCartUI();
        }

        function updateCartUI() {
            const totalQty = Object.values(cart).reduce((a, b) => a + b, 0);
            const totalPrice = Object.entries(cart).reduce((sum, [id, qty]) => {
                const item = menuItems.find(i => i.id == id);
                if (!item) return sum; // Handle case where item was deleted
                return sum + (item.price * qty);
            }, 0);

            // Update Header Badge
            const badge = document.getElementById('cart-count');
            badge.innerText = totalQty;
            badge.classList.toggle('hidden', totalQty === 0);

            // Update Bottom Bar
            const cartBar = document.getElementById('cart-bar');
            document.getElementById('total-price').innerText = totalPrice;
            cartBar.classList.toggle('hidden', totalQty === 0);
        }

        function openCheckoutModal() {
            const summary = document.getElementById('order-summary');
            
            // Clean cart of any deleted items
            Object.keys(cart).forEach(id => {
                if (!menuItems.find(i => i.id == id)) delete cart[id];
            });
            
            if (Object.keys(cart).length === 0) {
                alert('⚠️ Your cart is empty!');
                return;
            }

            let html = '<div class="space-y-2">';
            Object.entries(cart).forEach(([id, qty]) => {
                const item = menuItems.find(i => i.id == id);
                if (!item) return; // Skip if item not found
                html += `<div class="flex justify-between items-center py-2 border-b border-gray-200">
                    <span class="font-medium text-gray-700">${qty} × ${item.name}</span>
                    <span class="font-bold text-gray-900">₹${item.price * qty}</span>
                </div>`;
            });
            html += '</div>';
            html += `<div class="mt-4 pt-3 border-t-2 border-purple-200 flex justify-between items-center">
                <span class="font-bold text-gray-900">Total</span>
                <span class="text-xl font-bold text-purple-600">₹${document.getElementById('total-price').innerText}</span>
            </div>`;

            summary.innerHTML = html;
            checkoutModal.open();
        }

        function closeCheckoutModal() {
            checkoutModal.close();
        }

        // Expose functions to global scope
        window.openCheckoutModal = openCheckoutModal;
        window.closeCheckoutModal = closeCheckoutModal;
        window.updateQuantity = updateQuantity;
        window.setCategory = setCategory;
        window.processCheckout = processCheckout;
        window.validatePhone = validatePhone;
        window.refreshMenu = refreshMenu;

        // Phone validation for Indian numbers
        function validatePhone(input) {
            const phone = input.value;
            const errorEl = document.getElementById('phone-error');
            const isValid = /^[6-9][0-9]{9}$/.test(phone);
            
            if (phone.length === 0) {
                errorEl.classList.add('hidden');
                input.classList.remove('border-red-500', 'border-green-500');
            } else if (phone.length === 10 && isValid) {
                errorEl.classList.add('hidden');
                input.classList.remove('border-red-500');
                input.classList.add('border-green-500');
            } else {
                errorEl.classList.remove('hidden');
                input.classList.remove('border-green-500');
                input.classList.add('border-red-500');
            }
            return isValid;
        }

        async function processCheckout() {
            const name = document.getElementById('customer-name').value.trim();
            const phone = document.getElementById('customer-phone').value.trim();
            const address = document.getElementById('customer-address').value.trim();

            // Validate name
            if (!name) {
                alert("⚠️ Please enter your name.");
                return;
            }

            // Validate phone - must be 10 digits starting with 6-9
            if (!phone || !/^[6-9][0-9]{9}$/.test(phone)) {
                alert("⚠️ Please enter a valid 10-digit Indian mobile number (starting with 6, 7, 8, or 9)");
                document.getElementById('customer-phone').focus();
                return;
            }

            // Validate address
            if (!address) {
                alert("⚠️ Please enter your delivery address.");
                return;
            }

            // 1. Prepare Order Data
            let totalPrice = 0;
            const items = [];

            Object.entries(cart).forEach(([id, qty]) => {
                const item = menuItems.find(i => i.id == id);
                if (!item) return; // Skip deleted items
                const itemTotal = item.price * qty;
                totalPrice += itemTotal;
                items.push({
                    name: item.name,
                    quantity: qty,
                    price: item.price,
                    total: itemTotal
                });
            });
            
            if (items.length === 0) {
                alert('⚠️ Your cart is empty!');
                return;
            }

            const orderData = {
                name,
                phone,
                address,
                items,
                totalPrice
            };

            // 2. Submit to Backend
            try {
                const response = await fetch(`${API_URL}/orders`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });
                const result = await response.json();
                console.log("✅ Backend Response:", result);
            } catch (error) {
                console.error("❌ Error submitting order:", error);
                alert("Could not save order to backend. Proceeding to WhatsApp...");
            }

            // 3. Redirect to WhatsApp
            let orderText = `*🍛 New Order from ${name}*\n`;
            orderText += `📱 *Phone:* +91 ${phone}\n\n`;
            orderText += `*Order Items:*\n`;
            items.forEach(item => {
                orderText += `• ${item.quantity} × ${item.name} - ₹${item.total}\n`;
            });
            orderText += `\n💰 *Total: ₹${totalPrice}*`;
            orderText += `\n\n📍 *Delivery Address:*\n${address}`;
            orderText += `\n\n_Order placed via Amma Food Center App_`;

            const encodedText = encodeURIComponent(orderText);
            const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedText}`;

            window.open(waUrl, '_blank');
            closeCheckoutModal();

            // Show success message
            alert("✅ Order placed successfully! Redirecting to WhatsApp...");

            // Clear form fields
            document.getElementById('customer-name').value = '';
            document.getElementById('customer-phone').value = '';
            document.getElementById('customer-address').value = '';

            // Clear cart
            cart = {};
            updateCartUI();
            renderMenu();
        }

        // Initialize
        init();
    </script>
</body>
