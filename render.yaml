services:
  - type: web
    name: amma-food-center
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: RENDER
        value: "true"
    disk:
      name: amma-data
      mountPath: /data
      sizeGB: 1
